name: Wiki ownership boundary

# The boundary rule in CLAUDE.md — the human owns sources/ and judgment, the
# agent owns wiki/ and all bookkeeping — was until now enforced by nothing but
# a paragraph. wiki/shepherd-review-gates.md, a page this brain wrote itself,
# says an invariant that lives in prose is not an invariant: put the authority
# in the signature and fail closed. This is that gate.
#
# Rule: every non-merge commit touching the agent-owned layer must be
# agent-authored. To change a conclusion, add a correcting source or discuss it
# so the agent rewrites the page — do not hand-edit the wiki.
#
# Escape hatch, deliberately explicit and permanent in the history: put
#   Wiki-Override: <reason>
# in the commit message. Allowed, but it leaves a trace, which is the point.

on:
  pull_request:
    paths:
      - 'wiki/**'
      - 'index.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit touching wiki/ must be agent-authored
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || {
            echo "::error::cannot resolve base ref $BASE — failing closed"
            exit 1
          }

          RANGE="$BASE...HEAD"
          VIOLATIONS=0

          while read -r sha; do
            [ -z "$sha" ] && continue

            # Only commits that actually touch the agent-owned layer.
            git diff-tree --no-commit-id --name-only -r "$sha" \
              | grep -qE '^(wiki/|index\.md$)' || continue

            EMAIL=$(git log -1 --format='%ae' "$sha")
            BODY=$(git log -1 --format='%B' "$sha")
            SUBJECT=$(git log -1 --format='%s' "$sha")

            if [ "$EMAIL" = "noreply@anthropic.com" ]; then
              continue
            fi
            if printf '%s' "$BODY" | grep -qi '^Co-Authored-By: Claude'; then
              continue
            fi
            if printf '%s' "$BODY" | grep -qi '^Wiki-Override:'; then
              REASON=$(printf '%s' "$BODY" | grep -i '^Wiki-Override:' | head -1)
              echo "::warning::${sha:0:8} hand-edits the wiki with an explicit override — ${REASON}"
              continue
            fi

            echo "::error::${sha:0:8} (\"$SUBJECT\", $EMAIL) edits the agent-owned layer but is not agent-authored."
            VIOLATIONS=$((VIOLATIONS+1))
          done < <(git rev-list --no-merges "$RANGE")

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "The boundary rule (CLAUDE.md) keeps this brain trustworthy:"
            echo "  sources/ is the human's, immutable to the agent."
            echo "  wiki/    is the agent's, not hand-tuned by the human."
            echo "To change a conclusion, add a correcting source in sources/ and"
            echo "let the agent rewrite the page — or add a 'Wiki-Override: <reason>'"
            echo "trailer if you really mean to bypass this."
            exit 1
          fi

          echo "Boundary intact: every wiki-touching commit is agent-authored."
